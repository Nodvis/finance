x-config:
  postgres-password: &postgres-password "CHANGE_ME_TO_A_STRONG_RANDOM_PASSWORD"
  auth-secret: &auth-secret "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_CHARS_MIN"

services:
  finance:
    image: ghcr.io/nodvis/finance:0.2.5
    ports:
      - "3990:3990"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nodvis_finance
      DB_USER: nodvis_finance
      DB_PASSWORD: *postgres-password
      BETTER_AUTH_SECRET: *auth-secret

    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3990/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nodvis_finance
      POSTGRES_USER: nodvis_finance
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - nodvis-finance-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodvis_finance -d nodvis_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nodvis-finance-data:
