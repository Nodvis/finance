name: Bug report
description: Report a reproducible problem in Nodvis Finance
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs or real financial data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Docker/Compose or development setup, browser and locale.
