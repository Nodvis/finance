name: Feature request
description: Suggest a user-facing improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Household problem
      description: What should become easier or clearer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Financial and privacy considerations
      description: Mention money, authorization, import or data-retention implications.
