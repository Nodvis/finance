name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and domain tests
        run: pnpm test

      - name: Build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-build-secret-not-for-runtime
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate CI database
        env:
          DATABASE_URL: postgres://ci:***@127.0.0.1:5432/ci
        run: |
          pnpm db:migrate
          PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d ci -c "ALTER DATABASE ci SET nodvis.ci_mode = 'true';"

      - name: End-to-end smoke tests
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-e2e-secret-not-for-runtime
          BETTER_AUTH_URL: http://127.0.0.1:3000
        run: pnpm test:e2e
